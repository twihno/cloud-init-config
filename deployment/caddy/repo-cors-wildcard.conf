# Template repo host — Caddy — CORS: any origin ("*")
#
# Serves a directory containing an index.json + template JSON files (see
# ../../TEMPLATE_SCHEMA.md), allowing any app instance anywhere to add this as a
# remote repo. Fine for a genuinely public/shared template repo; avoid this if the
# repo could ever contain anything sensitive — it becomes fetchable, unauthenticated,
# by script from any website a browser visits.
#
# Usage: paste this block into your Caddyfile, or run Caddy with this file directly.

repo.example.internal {
    root * /var/www/cloud-init-templates
    file_server

    header {
        Access-Control-Allow-Origin "*"
    }
}
