# Cloud-Init Config — nginx site config
#
# Serves the app's production build (`pnpm run build` → dist/: index.html, editor/,
# assets/, config.json, templates/) with the strictest Content-Security-Policy and
# companion security headers that still let the app work. See ../README.md for a
# directive-by-directive explanation, and for why `connect-src` can't be locked to
# 'self' unless you don't use "Add remote repo".
#
# Usage: adjust `server_name`, `root` (point it at dist/), and the ssl_certificate*
# paths, then drop this into /etc/nginx/sites-available/ (and symlink into
# sites-enabled/), or `include` it from an existing server block. `try_files $uri
# $uri/ =404` below already serves /editor/ as editor/index.html — no rewrite rules
# are needed since the editor is a real static page, not a client-side route.

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cloud-init-config.example.internal;

    ssl_certificate     /etc/ssl/certs/cloud-init-config.crt;
    ssl_certificate_key /etc/ssl/private/cloud-init-config.key;

    root /var/www/cloud-init-config;
    index index.html;

    # --- Security headers -------------------------------------------------------
    # connect-src allows same-origin plus any https: host because "Add remote repo"
    # lets the user fetch an arbitrary index.json/template URL by design — there is no
    # way to know those hosts in advance. If you never use that feature, change this
    # line to `connect-src 'self';` to lock fetches to this origin only.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'none'; connect-src 'self' https:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; frame-src 'none'; worker-src 'none'; manifest-src 'none'; media-src 'none'; child-src 'none'; upgrade-insecure-requests" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), usb=(), xr-spatial-tracking=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    # -----------------------------------------------------------------------------

    location / {
        try_files $uri $uri/ =404;
    }
}

# Plain-HTTP redirect to HTTPS. If you're deploying to an internal/LAN network with no
# TLS at all, delete this block instead, drop the `listen 443 ssl ...` lines above down
# to a plain `listen 80;`, and remove Strict-Transport-Security plus
# "upgrade-insecure-requests" from the CSP (both assume HTTPS is in use).
server {
    listen 80;
    listen [::]:80;
    server_name cloud-init-config.example.internal;
    return 301 https://$host$request_uri;
}
