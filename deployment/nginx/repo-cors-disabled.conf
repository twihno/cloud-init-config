# Template repo host — nginx — CORS: disabled
#
# Serves a directory containing an index.json + template JSON files (see
# ../../TEMPLATE_SCHEMA.md) with no CORS headers at all. This is nginx's default
# behavior for static files, so there is nothing to add — this file exists only to
# document the choice explicitly and give you a ready-to-adapt server block.
#
# Effect: only usable as an app instance's own bundled `./templates` repo (same
# origin), or when browsed directly. Any *other* app instance's "Add remote repo" will
# fail with a CORS error, because the browser blocks the cross-origin fetch entirely.

server {
    listen 443 ssl http2;
    server_name repo.example.internal;

    ssl_certificate     /etc/ssl/certs/repo.example.internal.crt;
    ssl_certificate_key /etc/ssl/private/repo.example.internal.key;

    root /var/www/cloud-init-templates;
    default_type application/json;

    location / {
        try_files $uri =404;
    }
}
