# Template repo host — nginx — CORS: one specific domain
#
# Serves a directory containing an index.json + template JSON files (see
# ../../TEMPLATE_SCHEMA.md), allowing exactly one named origin to add this as a
# remote repo. Replace the Access-Control-Allow-Origin value with the exact
# scheme+host(+port) of that app instance — no path, no trailing slash.
#
# A plain cross-origin GET with no custom request headers never triggers a CORS
# preflight, so there is no OPTIONS handling to add here — the Allow-Origin header on
# the actual response is all a browser checks.
#
# Need more than one allowed origin? Use nginx's `map` directive to look the request's
# Origin header up against an allowlist and echo it back only for matches, instead of
# hardcoding a single value here.

server {
    listen 443 ssl http2;
    server_name repo.example.internal;

    ssl_certificate     /etc/ssl/certs/repo.example.internal.crt;
    ssl_certificate_key /etc/ssl/private/repo.example.internal.key;

    root /var/www/cloud-init-templates;
    default_type application/json;

    location / {
        add_header Access-Control-Allow-Origin "https://cloud-init-config.example.internal" always;
        add_header Vary "Origin" always;
        try_files $uri =404;
    }
}
