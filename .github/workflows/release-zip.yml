name: Attach deployment zip to release

# Only the files actually needed to serve the static site are included — not
# README.md/TEMPLATE_SCHEMA.md (docs) or anything else in the repo.
on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  zip-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Zip deployment files
        run: |
          zip -r "cloud-init-config-${{ github.event.release.tag_name }}.zip" \
            index.html \
            style.css \
            config.json \
            js \
            templates

      - name: Upload zip to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            "cloud-init-config-${{ github.event.release.tag_name }}.zip" \
            --clobber
